[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseml"
version = "0.2.18"
description = "A live ML training debugger for tracking, diagnosing, verifying, and patching training runs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }



authors = [
    { name = "Yash Patel", email = "codeyash09@gmail.com" }
]

keywords = [
    "machine-learning",
    "deep-learning",
    "debugging",
    "ml-debugging",
    "training",
    "pytorch",
    "tensorflow",
    "numpy",
    "cupy",
    "jax",
    "gradients",
    "training-debugger"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
]

dependencies = [
    "numpy",
    "matplotlib",
    "pillow",
    "litellm",
    "fpdf2",
    "py-spy",
]

[project.scripts]
pulse = "pulse.cli:main"

[project.optional-dependencies]
torch = [
    "torch"
]

tensorflow = [
    "tensorflow"
]

cupy = [
    "cupy-cuda12x"
]

jax = [
    "jax"
]

[project.urls]
Homepage = "https://pulsedb.netlify.app/"
Repository = "https://github.com/codeyash09/PulseML"
Issues = "https://github.com/codeyash09/PulseML/issues"
Documentation = "https://pulsedb.netlify.app/"

[tool.setuptools.packages.find]
where = ["src"]
